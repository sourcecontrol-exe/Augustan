version: '3.8'

services:
  augustan-trading:
    build: .
    container_name: augustan-trading-system
    restart: unless-stopped
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Environment variables for secrets (override .env for production)
    environment:
      # Trading Configuration
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - LIVE_TRADING=${LIVE_TRADING:-false}
      
      # Exchange API Keys (from Docker secrets or environment)
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      
      - BINANCE_FUTURES_API_KEY=${BINANCE_FUTURES_API_KEY}
      - BINANCE_FUTURES_SECRET_KEY=${BINANCE_FUTURES_SECRET_KEY}
      - BINANCE_FUTURES_TESTNET=${BINANCE_FUTURES_TESTNET:-true}
      
      # Risk Management
      - MAX_RISK_PER_TRADE=${MAX_RISK_PER_TRADE:-0.01}
      - MAX_PORTFOLIO_RISK=${MAX_PORTFOLIO_RISK:-0.1}
      - INITIAL_BALANCE=${INITIAL_BALANCE:-10000.0}
      
      # Data Configuration
      - PRIMARY_EXCHANGE=${PRIMARY_EXCHANGE:-binance}
      - DATA_TIMEFRAMES=${DATA_TIMEFRAMES:-1m,3m,5m}
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      
      # Database
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/trading.db}
      
      # Security
      - API_RATE_LIMIT=${API_RATE_LIMIT:-1200}
      - API_TIMEOUT=${API_TIMEOUT:-30}
      - ENABLE_SSL_VERIFICATION=${ENABLE_SSL_VERIFICATION:-true}
    
    # Docker secrets for production (uncomment for production)
    # secrets:
    #   - binance_api_key
    #   - binance_secret_key
    #   - binance_futures_api_key
    #   - binance_futures_secret_key
    
    # Volumes for persistent data
    volumes:
      - augustan_data:/app/data
      - augustan_logs:/app/logs
      - augustan_config:/app/config
    
    # Ports (if needed for API endpoints)
    ports:
      - "8000:8000"  # API server (if implemented)
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    # Network
    networks:
      - augustan_network

  # Optional: Database service (if using PostgreSQL/MySQL)
  postgresql:
    image: postgres:15-alpine
    container_name: augustan-postgresql
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-augustan_trading}
      - POSTGRES_USER=${POSTGRESQL_USERNAME:-augustan_user}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    ports:
      - "5432:5432"
    
    networks:
      - augustan_network
    
    profiles:
      - database

  # Optional: Redis for caching (if needed)
  redis:
    image: redis:7-alpine
    container_name: augustan-redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - augustan_network
    
    profiles:
      - cache

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: augustan-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    ports:
      - "9090:9090"
    
    networks:
      - augustan_network
    
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: augustan-grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    
    ports:
      - "3000:3000"
    
    networks:
      - augustan_network
    
    profiles:
      - monitoring

# Named volumes for persistent data
volumes:
  augustan_data:
    driver: local
  augustan_logs:
    driver: local
  augustan_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Docker secrets for production (uncomment for production)
# secrets:
#   binance_api_key:
#     external: true
#   binance_secret_key:
#     external: true
#   binance_futures_api_key:
#     external: true
#   binance_futures_secret_key:
#     external: true
#   postgresql_password:
#     external: true
#   redis_password:
#     external: true
#   grafana_password:
#     external: true

# Network for service communication
networks:
  augustan_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
